name: Descompactar ZIP

on:
push:
paths:
- '.zip'
- '**/.zip'

permissions:
contents: write

jobs:
unzip:
runs-on: ubuntu-latest

steps:
  - name: Baixar arquivos do repositório
    uses: actions/checkout@v4

  - name: Descompactar arquivos ZIP
    shell: bash
    run: |
      shopt -s globstar nullglob

      for z in **/*.zip; do
        echo "Descompactando: $z"
        unzip -o "$z" -d "$(dirname "$z")"
      done

  - name: Salvar alterações no GitHub
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A

      if ! git diff --cached --quiet; then
        git commit -m "Descompacta arquivos ZIP automaticamente"
        git push
      else
        echo "Nenhuma alteração para salvar."
      fi
